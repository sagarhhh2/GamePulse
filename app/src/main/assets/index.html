<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Game Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0b1120; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075); --line:rgba(255,255,255,.08);
  --text:#eef2f8; --muted:#8a94a8; --dim:#5d6679;
  --a1:#5b8cff; --a2:#a855f7; --grad:linear-gradient(135deg,#5b8cff,#a855f7);
  --good:#22d3a0; --bad:#ff5c7a; --warn:#ffb547; --cyan:#38d6ff;
  --r:20px; --tab:72px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none;transition:border-color .2s,background .2s}
input:focus,textarea:focus,select:focus{border-color:var(--a1);background:rgba(91,140,255,.08)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* animated backdrop */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:340px;height:340px;background:#3b5bff;top:-120px;left:-100px}
.bgfx i:nth-child(2){width:300px;height:300px;background:#9b3cf0;top:30%;right:-140px;animation-duration:22s}
.bgfx i:nth-child(3){width:260px;height:260px;background:#0fb6a0;bottom:-120px;left:10%;opacity:.18;animation-duration:26s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.15)}}

/* screens */
.screen{position:fixed;inset:0;z-index:1;display:none}
.screen.on{display:block}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--tab) + 28px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}

/* glass */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.press{transition:transform .18s var(--ease),background .2s}
.press:active{transform:scale(.97)}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0}}

/* ---------- login ---------- */
#login .pad{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin:8vh 0 26px}
.logo{width:84px;height:84px;border-radius:26px;background:var(--grad);display:grid;place-items:center;box-shadow:0 18px 50px -10px rgba(120,100,255,.7);position:relative;animation:float 5s ease-in-out infinite}
.logo:after{content:"";position:absolute;inset:-8px;border-radius:32px;border:1px solid rgba(160,140,255,.35);animation:ring 2.8s ease-out infinite}
.logo svg{width:44px;height:44px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.logo svg path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 1.4s .3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes ring{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:22px}
.brand p{color:var(--muted);margin-top:6px;max-width:300px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.feat div{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12.5px;color:#c9d1df}
.feat svg{color:var(--a1)}
.rbx{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;background:#fff;color:#0b0d12;font-weight:700;font-size:16px;box-shadow:0 10px 30px -10px rgba(255,255,255,.35);position:relative;overflow:hidden}
.rbx svg{width:22px;height:22px;stroke-width:2.4}
.rbx:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(120,140,255,.25),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.fine{color:var(--dim);font-size:12px;text-align:center;margin-top:12px}
.saved{margin-bottom:16px}
.saved h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 4px 8px}
.acct{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;background:var(--glass2);object-fit:cover;flex:none;border:2px solid rgba(255,255,255,.1)}
.acct .t{flex:1;min-width:0}
.acct .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .t small{color:var(--muted)}
.chev{color:var(--dim)}

/* pin */
.pin{display:flex;flex-direction:column;align-items:center;padding-top:10vh}
.pin .av{width:84px;height:84px;margin-bottom:14px}
.dots{display:flex;gap:16px;margin:22px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.dots i.f{background:var(--text);border-color:var(--text);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.keys button{width:76px;height:76px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:26px;font-weight:500;transition:transform .12s,background .15s}
.keys button:active{transform:scale(.9);background:var(--glass2)}
.keys .ghost{background:none;border:0;font-size:14px;color:var(--muted)}

/* ---------- app shell ---------- */
.page{opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .28s ease,transform .38s var(--ease)}
.page.on{opacity:1;transform:none;pointer-events:auto}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;z-index:5;display:flex;padding:6px;border-radius:24px;background:rgba(16,22,38,.78);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 20px 40px -20px #000;max-width:520px;margin:0 auto}
.tabbar .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(168,85,247,.22));border:1px solid rgba(140,130,255,.3);transition:transform .45s var(--ease)}
.tabbar button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);transition:color .25s}
.tabbar button svg{transition:transform .35s var(--ease)}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.12);color:#a9b8ff}

.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top .av{width:42px;height:42px}
.top .hi{flex:1;min-width:0}
.top .hi small{color:var(--muted);font-size:12.5px;display:block}
.top .hi b{font-size:19px;font-weight:700;letter-spacing:-.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ib.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h2.sec{font-size:17px;font-weight:700;letter-spacing:-.2px;margin:24px 2px 12px;display:flex;align-items:center;gap:8px}
h2.sec small{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}

/* hero */
.hero{padding:18px;position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(91,140,255,.18),rgba(168,85,247,.10) 50%,rgba(255,255,255,.03))}
.hero:before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 65%)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#bfffe9;background:rgba(34,211,160,.12);border:1px solid rgba(34,211,160,.3);padding:4px 10px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(34,211,160,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(34,211,160,0)}100%{box-shadow:0 0 0 0 rgba(34,211,160,0)}}
.big{font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.05;margin-top:10px}
.chipd{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
.chipd.up{color:var(--good);background:rgba(34,211,160,.12)} .chipd.down{color:var(--bad);background:rgba(255,92,122,.12)} .chipd.flat{color:var(--muted);background:var(--glass)}
.hero .sub{color:var(--muted);font-size:13px;margin-top:4px}
.chart{position:relative;margin-top:10px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:rgba(10,14,26,.92);border:1px solid var(--line);padding:5px 9px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}
.tip b{display:block;font-size:13.5px}
.tip span{color:var(--muted);font-size:11px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{padding:14px;position:relative;overflow:hidden}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.tile .ic svg{width:18px;height:18px}
.tile b{font-size:22px;font-weight:800;letter-spacing:-.5px;display:block}
.tile span{font-size:12px;color:var(--muted)}
.c-blue{background:rgba(91,140,255,.15);color:#8fb0ff} .c-purple{background:rgba(168,85,247,.15);color:#c99bff}
.c-green{background:rgba(34,211,160,.14);color:#5ff0c4} .c-amber{background:rgba(255,181,71,.14);color:#ffcd7f}
.c-pink{background:rgba(255,92,122,.14);color:#ff94a8} .c-cyan{background:rgba(56,214,255,.14);color:#86e6ff}

/* carousel */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.spot{flex:none;width:72%;max-width:300px;scroll-snap-align:start;overflow:hidden;position:relative}
.spot .img{height:130px;background:var(--glass2) center/cover;position:relative}
.spot .img:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(7,11,20,.95))}
.spot .rank{position:absolute;top:10px;left:10px;z-index:1;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.spot .meta{position:absolute;left:12px;right:12px;bottom:10px;z-index:1}
.spot .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot .meta span{font-size:12.5px;color:#cfd6e4;display:flex;align-items:center;gap:5px}
.spot .meta span i{width:6px;height:6px;border-radius:50%;background:var(--good)}

/* game rows */
.grow{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px}
.gicon{width:58px;height:58px;border-radius:16px;background:var(--glass2) center/cover;flex:none;position:relative;box-shadow:0 8px 20px -10px #000}
.gmid{flex:1;min-width:0}
.gmid b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmid small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmini{display:flex;gap:12px;margin-top:5px;font-size:12px;color:#b9c2d3}
.gmini span{display:inline-flex;align-items:center;gap:4px}
.gmini svg{width:13px;height:13px;color:var(--dim)}
.gright{text-align:right;flex:none}
.gright b{font-size:19px;font-weight:800;display:block;letter-spacing:-.4px}
.gright small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:flex-end}
.gright small i{width:6px;height:6px;border-radius:50%;background:var(--good)}

.searchbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:16px}
.searchbar input{border:0;background:none;padding:0;height:100%}
.searchbar input:focus{background:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.25s var(--ease)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(120,100,255,.8)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin-top:12px;position:relative}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:var(--text)}
.seg .sind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--glass2);border:1px solid var(--line);transition:transform .4s var(--ease),width .4s var(--ease)}

/* skeleton */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:12px}
@keyframes sk{from{background-position:100% 50%}to{background-position:0 50%}}

/* detail page */
#detail{position:fixed;inset:0;z-index:8;background:var(--bg);transform:translateX(100%);transition:transform .45s var(--ease);box-shadow:-20px 0 40px rgba(0,0,0,.5)}
#detail.on{transform:none}
.banner{height:240px;position:relative;background:var(--bg2) center/cover;margin:0 -16px;margin-top:calc(-14px - env(safe-area-inset-top))}
.banner:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,.25),rgba(7,11,20,.1) 40%,var(--bg))}
.banner .ib{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:2;background:rgba(0,0,0,.4);backdrop-filter:blur(10px)}
.dhead{display:flex;gap:14px;align-items:flex-end;margin-top:-60px;position:relative;z-index:1}
.dhead .gicon{width:84px;height:84px;border-radius:22px;border:3px solid var(--bg)}
.dhead h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.dhead small{color:var(--muted)}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-weight:700;font-size:14px;background:var(--grad);color:#fff;box-shadow:0 10px 24px -12px rgba(120,100,255,.9)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.white{background:#fff;color:#0b0d12}
.btn svg{width:17px;height:17px}
.livebox{margin-top:16px;padding:16px}
.livebox .row{display:flex;align-items:flex-end;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:12px}
.stat svg{width:16px;height:16px;color:var(--dim)}
.stat b{display:block;font-size:17px;font-weight:750;margin-top:6px}
.stat span{font-size:11.5px;color:var(--muted)}
.likebar{height:6px;border-radius:3px;background:rgba(255,92,122,.5);overflow:hidden;margin-top:8px}
.likebar i{display:block;height:100%;background:linear-gradient(90deg,#22d3a0,#5ff0c4);border-radius:3px;width:0;transition:width 1s var(--ease)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{padding:13px;text-align:left;border:1px solid var(--line);transition:border-color .25s,background .25s,transform .18s}
.metric.on{border-color:rgba(140,130,255,.6);background:linear-gradient(135deg,rgba(91,140,255,.14),rgba(168,85,247,.1))}
.metric .mh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.metric .mh .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.metric .mh svg{width:14px;height:14px}
.metric b{display:block;font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.4px}
.metric .d{font-size:11.5px;font-weight:700}
.bigchart{padding:16px;margin-top:12px}
.bigchart .hd{display:flex;justify-content:space-between;align-items:baseline}
.bigchart .hd b{font-size:15px}
.bigchart .hd span{font-size:12px;color:var(--muted)}
.locked{padding:20px;text-align:center;margin-top:12px}
.locked .ic{width:54px;height:54px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center}
.locked p{color:var(--muted);font-size:13.5px;margin:6px 0 14px}

/* lists in profile */
.list{padding:4px 14px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.li .ic svg{width:17px;height:17px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12px}
.li .gimg{width:34px;height:34px;border-radius:10px;background:var(--glass2) center/cover;flex:none}
.tog{position:relative;width:50px;height:30px;flex:none}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog i{position:absolute;inset:0;background:rgba(255,255,255,.12);border-radius:999px;transition:.3s var(--ease)}
.tog i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.35s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tog input:checked+i{background:var(--good)}
.tog input:checked+i:after{transform:translateX(20px)}
.pbadge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.pbadge svg{width:12px;height:12px;stroke-width:3}
.fine svg{width:13px;height:13px;vertical-align:-2px}
.inl{display:inline-flex;align-items:center;gap:5px}
.inl svg{width:14px;height:14px}
.pf{padding:20px;text-align:center;position:relative;overflow:hidden}
.pf .av{width:86px;height:86px;margin:0 auto 10px;border:3px solid rgba(140,130,255,.5);box-shadow:0 0 0 6px rgba(140,130,255,.12)}
.pf h3{font-size:21px;font-weight:800}
.pf small{color:var(--muted)}
.danger{color:var(--bad)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;background:#0e1424;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s var(--ease);max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:0 auto 16px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.steps{counter-reset:s;margin:4px 0 16px;padding:0}
.steps li{list-style:none;counter-increment:s;position:relative;padding:0 0 12px 38px;font-size:13.5px;color:#c9d1df}
.steps li:before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:9px;background:rgba(91,140,255,.18);color:#a9b8ff;display:grid;place-items:center;font-weight:800;font-size:12.5px}
.steps code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;color:#e3e8ff;white-space:nowrap}
.copyrow .mono{white-space:normal;word-break:break-all}
.copyrow{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px dashed var(--line);margin:6px 0 4px}
.copyrow .mono{flex:1;background:none;padding:0}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:30;background:rgba(20,26,44,.95);border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.35s var(--ease);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:17px;height:17px}

/* pull to refresh */
.ptr{position:absolute;left:50%;top:calc(6px + env(safe-area-inset-top));z-index:3;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);display:grid;place-items:center;transform:translateY(-60px);opacity:0}
.ptr.go svg{animation:spin .8s linear infinite}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{width:64px;height:64px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center}
.empty .ic svg{width:28px;height:28px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.demo{font-size:12px;color:#ffd99a;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.3);padding:8px 12px;border-radius:12px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.demo svg{width:15px;height:15px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(7,11,20,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:30px}
.overlay.on{display:flex}
.loader{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--a1);animation:spin .8s linear infinite}
</style>

<script>
(function(){
"use strict";
/* =========================================================
   Basics
   ========================================================= */
const N = window.Native || null;
const DEMO = !N;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const ic = (n, cls) => '<svg class="i' + (cls ? " " + cls : "") + '"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const REDIRECT = "gamepulse://oauth";
const OAUTH = "https://apis.roblox.com/oauth/v1";

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const secure = {
  get(k){ try{ if(N) return N.secureGet(k) || null; return localStorage.getItem("sec_" + k); }catch(e){ return null; } },
  set(k, v){ try{ if(N) N.secureSet(k, v == null ? "" : v); else if(v == null) localStorage.removeItem("sec_" + k); else localStorage.setItem("sec_" + k, v); }catch(e){} },
  getJ(k, d){ try{ const v = this.get(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  setJ(k, v){ this.set(k, v == null ? null : JSON.stringify(v)); }
};
function haptic(){ try{ N && N.haptic(); }catch(e){} }
function openUrl(u){ if(N) N.openUrl(u); else window.open(u, "_blank"); }

/* number formatting */
function fmt(n, d){
  if(n == null || isNaN(n)) return "–";
  const a = Math.abs(n);
  if(a >= 1e9) return (n/1e9).toFixed(a >= 1e10 ? 0 : 1).replace(/\.0$/,"") + "B";
  if(a >= 1e6) return (n/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/,"") + "M";
  if(a >= 1e4) return Math.round(n/1e3) + "K";
  if(a >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return d != null ? Number(n).toFixed(d) : String(Math.round(n));
}
const full = n => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString();
const mins = m => m == null || isNaN(m) ? "–" : (m >= 60 ? Math.floor(m/60) + "h " + Math.round(m % 60) + "m" : (m >= 10 ? Math.round(m) : m.toFixed(1)) + "m");
const pct = v => v == null || isNaN(v) ? "–" : (v <= 1.0001 ? v * 100 : v).toFixed(1) + "%";
function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60) + "m ago";
  if(s < 86400) return Math.floor(s/3600) + "h ago"; if(s < 86400*30) return Math.floor(s/86400) + "d ago";
  if(s < 86400*365) return Math.floor(s/86400/30) + "mo ago"; return Math.floor(s/86400/365) + "y ago";
}
function greet(){ const h = new Date().getHours(); return h < 5 ? "Up late" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }

/* count-up animation */
function countUp(el, to, f){
  f = f || full;
  const from = parseFloat(el.dataset.v || "0"); el.dataset.v = to;
  if(to == null || isNaN(to)){ el.textContent = "–"; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t){
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = f(from + (to - from) * e);
    if(p < 1) requestAnimationFrame(step); else el.textContent = f(to);
  })(t0);
}

/* toast */
let toastT;
function toast(msg, kind){
  const t = $("#toast");
  t.innerHTML = ic(kind === "err" ? "info" : "check") + esc(msg);
  t.style.color = kind === "err" ? "#ffb3c0" : "";
  t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* =========================================================
   Networking (native bridge on Android, fetch/demo elsewhere)
   ========================================================= */
let reqId = 0; const pending = {};
window.__nativeCb = function(id, status, text){
  const p = pending[id]; if(!p) return; delete pending[id];
  let json = null; try{ json = text ? JSON.parse(text) : null; }catch(e){}
  p({status, json, text});
};
function http(method, url, opt){
  opt = opt || {};
  const headers = Object.assign({}, opt.headers || {});
  let body = opt.body;
  if(body != null && typeof body !== "string"){ body = JSON.stringify(body); headers["Content-Type"] = headers["Content-Type"] || "application/json"; }
  if(N) return new Promise(res => { const id = String(++reqId); pending[id] = res; N.request(id, method, url, body || "", JSON.stringify(headers)); });
  if(DEMO) return sleep(120 + Math.random() * 250).then(() => demoHttp(method, url, body, headers));
  return fetch(url, {method, headers, body: body || undefined}).then(async r => { const text = await r.text(); let json = null; try{ json = JSON.parse(text); }catch(e){} return {status: r.status, json, text}; })
    .catch(() => ({status: 0, json: null, text: ""}));
}
function errOf(r){
  const e = new Error(r.status === 429 ? "Roblox is rate limiting, try again shortly" : r.status === 0 ? "No internet connection" : "Roblox error " + r.status);
  e.status = r.status; return e;
}
async function api(host, path, body){
  const url = "https://" + host + ".roblox.com" + path;
  for(let i = 0; ; i++){
    const r = await http(body ? "POST" : "GET", url, {body});
    if(r.status >= 200 && r.status < 300) return r.json || {};
    if(i < 2 && (r.status === 429 || r.status >= 500 || r.status === 0)){ await sleep(1000 * (i + 1)); continue; }
    throw errOf(r);
  }
}
const chunk = (a, n) => { const o = []; for(let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
async function pool(items, n, fn){ const out = []; let i = 0; await Promise.all(Array.from({length: Math.min(n, items.length)}, async () => { while(i < items.length){ const k = i++; out[k] = await fn(items[k], k); } })); return out; }

/* =========================================================
   State
   ========================================================= */
let S = Object.assign({accounts: [], active: null, refresh: 60, sort: "ccu", filter: "all"}, load("gp_state", {}));
const saveS = () => save("gp_state", S);
const acct = () => S.accounts.find(a => a.userId === S.active) || null;
let hist = {}, games = [], loading = false, lastAt = null, prevTotal = null, unlocked = false;
const histKey = () => "gp_hist_" + S.active;

/* =========================================================
   Roblox OAuth 2.0 (official "Sign in with Roblox")
   ========================================================= */
const clientId = () => load("gp_client", "") || "8761413591816145087";
async function startLogin(withAnalytics){
  haptic();
  if(DEMO){ return demoLogin(); }
  const cid = clientId(); if(!cid){ setupSheet(); return; }
  const pk = JSON.parse(N.pkce());            // {verifier, challenge} generated natively (SHA-256)
  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const scope = withAnalytics === false ? "openid profile" : "openid profile universe.analytics:read";
  save("gp_pending", {verifier: pk.verifier, state, withAnalytics: withAnalytics !== false, at: Date.now()});
  const u = OAUTH + "/authorize?client_id=" + encodeURIComponent(cid) + "&redirect_uri=" + encodeURIComponent(REDIRECT) +
    "&scope=" + encodeURIComponent(scope) + "&response_type=code&code_challenge=" + pk.challenge + "&code_challenge_method=S256&state=" + state;
  openUrl(u);
}
window.__oauth = async function(url){
  const q = {}; (url.split("?")[1] || "").split("&").forEach(p => { const [k, v] = p.split("="); if(k) q[decodeURIComponent(k)] = decodeURIComponent((v || "").replace(/\+/g, " ")); });
  const pend = load("gp_pending", null);
  if(!pend || q.state !== pend.state){ toast("Sign-in expired, please try again", "err"); return; }
  if(q.error){
    localStorage.removeItem("gp_pending");
    if(pend.withAnalytics && /scope/i.test(q.error + " " + (q.error_description || ""))){ toast("Analytics sign-in isn't enabled yet, signing in without it"); return startLogin(false); }
    if(q.error !== "access_denied") toast(q.error_description || q.error, "err");
    return;
  }
  overlay("Signing you in…");
  try{
    const r = await http("POST", OAUTH + "/token", {headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: "grant_type=authorization_code&code=" + encodeURIComponent(q.code) + "&code_verifier=" + encodeURIComponent(pend.verifier) + "&client_id=" + encodeURIComponent(clientId())});
    if(r.status !== 200 || !r.json || !r.json.access_token) throw new Error((r.json && (r.json.error_description || r.json.error)) || "Couldn't finish sign-in (" + r.status + ")");
    await finishLogin(r.json);
  }catch(e){ toast(e.message, "err"); }
  finally{ localStorage.removeItem("gp_pending"); overlay(null); }
};
async function finishLogin(tok){
  const info = await http("GET", OAUTH + "/userinfo", {headers: {Authorization: "Bearer " + tok.access_token}});
  if(info.status !== 200 || !info.json) throw new Error("Couldn't read your Roblox profile");
  const uid = Number(info.json.sub);
  const t = {access: tok.access_token, refresh: tok.refresh_token, exp: Date.now() + (tok.expires_in || 900) * 1000, scope: tok.scope || ""};
  secure.setJ("tok_" + uid, t);
  let a = S.accounts.find(x => x.userId === uid);
  if(!a){ a = {userId: uid, groups: {}, ownGames: true, extra: [], keys: 0}; S.accounts.push(a); }
  Object.assign(a, {username: info.json.preferred_username || info.json.name, displayName: info.json.nickname || info.json.name,
    avatar: info.json.picture || a.avatar || "", analyticsScope: t.scope ? /universe\.analytics/.test(t.scope) : true, scopeRaw: t.scope || "(Roblox sent none)"});
  S.active = uid; saveS();
  await loadResources(a);
  try{
    const gs = await api("groups", "/v2/users/" + uid + "/groups/roles");

  const [st, en] = rangeDates(days);

  const url = "https://apis.roblox.com/analytics-query-api/v1/universes/" + uni + "/metrics";

    }

    if(r.status < 200 || r.status >= 300) throw errOf(r);
    if(r.json && r.json.error) throw new Error(r.json.error.message || "Analytics error");
    a.anAuth = a.anAuth || {}; if(a.anAuth[uni] !== au.id){ a.anAuth[uni] = au.id; saveS(); }
    const vals = (r.json && r.json.response && r.json.response.values) || [];

function switchTab(t, force){

  haptic(); tab = t;
  $$(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + t));

async function renderDetailAnalytics(g, a){
  const box = $("#dAn"); if(!box) return;
  if(!hasAnalyticsSetup(a)){ box.innerHTML = lockedCard(); bindCommon(box); return; }
  box.innerHTML = '<div class="seg" id="rSeg"><div class="sind"></div>' + [[7, "7 days"], [28, "28 days"], [90, "90 days"]].map(r => '<button data-r="' + r[0] + '"' + (r[0] === detailRange ? ' class="on"' : "") + ">" + r[1] + "</button>").join("") + "</div>" +
    '<div class="mgrid" id="mGrid">' + METRICS.map(m => '<button class="card metric press' + (m.k === detailMetric ? " on" : "") + '" data-m="' + m.k + '"><div class="mh"><span class="ic ' + m.c + '">' + ic(m.ic) + "</span>" + m.n + '</div><b class="num"><span class="sk" style="display:block;height:22px;width:70%"></span></b><span class="d"></span></button>').join("") + "</div>" +
    '<div class="card bigchart"><div class="hd"><b id="bcT">' + MBY[detailMetric].n + '</b><span id="bcS">Last ' + detailRange + ' days</span></div><div id="bc" style="margin-top:12px"><div class="sk" style="height:160px"></div></div></div>';

  $$("#mGrid .metric").forEach(b => b.onclick = () => { haptic(); detailMetric = b.dataset.m; $$("#mGrid .metric").forEach(x => x.classList.toggle("on", x === b)); drawBig(); });
  const res = {};
  function drawBig(){
    const m = MBY[detailMetric], r = res[detailMetric];

  }
  const range = detailRange;

    try{ res[m.k] = await metric(a, g.id, m.k, range); }

async function loadAnalyticsTab(a, list){
  const seq = ++anSeq, days = Math.max(anRange, 2);
  const want = ["DailyActiveUsers", "AveragePlayTimeMinutesPerDAU", "TotalPlayTimeHours", "DailyRevenue"];
  const sumBy = {}, tot = {dau: 0, hrs: 0, rev: 0, playW: 0, playN: 0}; let any = false;
  await pool(list, 2, async g => {
    const r = {};
    for(const k of want){ try{ const v = await metric(a, g.id, k, days); r[k] = anRange === 1 ? {pts: v.pts.slice(-1)} : v; }catch(e){ r[k] = null; if(e.noAccess) break; } }
    if(seq !== anSeq) return;
    const row = $('[data-an="' + g.id + '"]'); if(!row) return;
    if(!r.DailyActiveUsers){ row.querySelector(".an").innerHTML = '<span style="color:var(--dim)">' + ic("lock") + "No access</span>"; return; }
    any = true;
    const dau = aggOf(MBY.DailyActiveUsers, r.DailyActiveUsers.pts), play = r.AveragePlayTimeMinutesPerDAU ? aggOf(MBY.AveragePlayTimeMinutesPerDAU, r.AveragePlayTimeMinutesPerDAU.pts) : null;
    const hrs = r.TotalPlayTimeHours ? aggOf(MBY.TotalPlayTimeHours, r.TotalPlayTimeHours.pts) : null, rev = r.DailyRevenue ? aggOf(MBY.DailyRevenue, r.DailyRevenue.pts) : null;
    countUp(row.querySelector(".an-dau"), dau, fmt);
    row.querySelector(".an").innerHTML = "<span>" + ic("clock") + mins(play) + "</span><span>" + ic("zap") + fmt(hrs) + "h</span><span>" + ic("robux") + fmt(rev) + "</span>";
    tot.dau += dau || 0; tot.hrs += hrs || 0; tot.rev += rev || 0; if(play != null && dau){ tot.playW += play * dau; tot.playN += dau; }
    r.DailyActiveUsers.pts.forEach(p => sumBy[p.t] = (sumBy[p.t] || 0) + p.v);
    countUp($("#aDau"), tot.dau, fmt); countUp($("#aPlay"), tot.playN ? tot.playW / tot.playN : null, mins); countUp($("#aHrs"), tot.hrs, v => fmt(v) + "h"); countUp($("#aRev"), tot.rev, fmt);
  });
  if(seq !== anSeq) return;
  const pts = Object.keys(sumBy).map(Number).sort().map(t => ({t, v: sumBy[t]}));
  const c = $("#aChart"); if(!c) return;
  if(!any){ c.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">None of these games are covered by your sign-in or API keys yet.</div>'; return; }
  if(anRange === 1) c.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Pick 7 or 28 days to see the trend.</div>';
  else chart(c, pts, {h: 150, f: v => fmt(v) + " users", date: true});
}

  if((m = url.match(/groups\/(\d+)\/gamesV2/))) return ok({data: (DG[m[1]] || []).map(g => ({id: g[0], name: g[1]}))});
  if(url.includes("/v2/users/") && url.includes("/games?")) return ok({data: DG.me.map(g => ({id: g[0], name: g[1]}))});
  if(url.includes("/groups/roles")) return ok({data: []});
  if(url.includes("/groups/icons")) return ok({data: [1001, 1002, 1003].map(id => ({targetId: id, imageUrl: demoImg(["PF", "NO", "BC"][id - 1001], id * 37 % 360)}))});
  if(url.includes("analytics-query-api")){
    const uni = Number((url.match(/universes\/(\d+)/) || [])[1]), b = JSON.parse(body || "{}"), s = seed(uni + b.metric);
    const st = new Date(b.startTime).getTime(), en = new Date(b.endTime).getTime(), days = Math.round((en - st) / 864e5);
    const base = {DailyActiveUsers: 800 + seed(uni) % 9000, AveragePlayTimeMinutesPerDAU: 9 + seed(uni) % 30, AverageSessionLengthMinutes: 6 + seed(uni) % 14, TotalPlayTimeHours: 200 + seed(uni) % 3000,
      Visits: 1500 + seed(uni) % 15000, ForwardD1Retention: .12 + (seed(uni) % 20) / 100, ForwardD7Retention: .03 + (seed(uni) % 8) / 100, DailyRevenue: 2000 + seed(uni) % 40000, PayingUsers: 20 + seed(uni) % 400}[b.metric] || 100;
    const pts = []; for(let i = 0; i < days; i++){ const t = st + i * 864e5, w = 1 + .18 * Math.sin(i / 1.1 + s % 7) + i / days * ((s % 40) - 15) / 100 + (new Date(t).getUTCDay() % 6 === 0 ? .2 : 0); pts.push({time: new Date(t).toISOString(), value: +(base * w).toFixed(3), status: "Valid"}); }
    if(uni === 5006) return {status: 403, json: {}};
    return ok({path: "x", done: true, response: {values: [{breakdowns: [], dataPoints: pts}]}});
  }
  if(url.includes("/universe")) return ok({universeId: 5007});
  const ids = (url.match(/universeIds=([\d,]+)/) || [, ""])[1].split(",").map(Number);
  const pick = ids.map(id => all.find(g => g[0] === id)).filter(Boolean);
  const t = Math.floor(Date.now() / 20000);
  if(url.includes("/games/votes")) return ok({data: pick.map(g => { const s = seed(g[1]); return {id: g[0], upVotes: 3000 + s % 90000, downVotes: 300 + s % 9000}; })});
  if(url.includes("/games/icons")) return ok({data: pick.map(g => ({targetId: g[0], imageUrl: demoImg(ini(g[1]), seed(g[1]) % 360)}))});
  if(url.includes("multiget/thumbnails")) return ok({data: pick.map(g => ({universeId: g[0], thumbnails: [{imageUrl: demoImg(g[1], seed(g[1]) % 360, 768, 432)}]}))});
  if(url.includes("/v1/games?")) return ok({data: pick.map(g => { const s = seed(g[1]), base = g[0] === 5006 ? 3 : (s % 4000) + 60;
    return {id: g[0], rootPlaceId: g[0] * 1000 + 7, name: g[1], playing: Math.max(0, Math.round(base * (1 + .12 * Math.sin(t / 2 + s)))), visits: (s % 900) * 100000 + 12345, maxPlayers: 12 + s % 30,
      favoritedCount: (s % 500) * 300, created: new Date(Date.now() - (s % 900) * 864e5).toISOString(), updated: new Date(Date.now() - (s % 20) * 36e5 * 7).toISOString(), genre_l1: ["Adventure", "Simulation", "Obby & Platformer", "Racing", "Roleplay"][s % 5]}; })});
  return ok({data: []});
}
if(DEMO){ // seed a few history points so charts look alive in the preview
  const h = load("gp_hist_4242", null);
  if(!h){ const now = Date.now(), hh = {__total: []}; const all = [].concat(...Object.values(DG));
    for(let i = 30; i > 0; i--){ let tot = 0; all.forEach(g => { if(g[0] === 5007) return; const s = seed(g[1]), b = g[0] === 5006 ? 3 : (s % 4000) + 60, v = Math.round(b * (1 + .12 * Math.sin(i / 3 + s) - i * .004)); (hh[g[0]] = hh[g[0]] || []).push([now - i * 60000, v]); tot += v; }); hh.__total.push([now - i * 60000, tot]); }
    save("gp_hist_4242", hh); }
}

(function start(){
  const a = acct();
  if(a && !a.needsLogin && secure.get("tok_" + a.userId)){
    if(secure.get("pin_" + a.userId)) pinScreen(a, () => { unlocked = true; enterApp(true); });
    else { unlocked = true; enterApp(true); }
  } else showLogin();
  setBack();
})();
})();
